[package]
name = "tryx"
description = "Nightly outcome types for Rust's question mark operator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["derive"]
derive = ["dep:tryx-derive"]
cancel = ["dep:tryx-cancel", "tryx-cancel/std"]
cancel-reason = ["cancel", "tryx-cancel/cancel-reason"]
checked = ["dep:tryx-checked", "tryx-checked/std"]
checked-serde = ["checked", "tryx-checked/serde"]
parsing = ["dep:tryx-parsing"]
stage = ["dep:tryx-stage"]

[dependencies]
tryx-derive = { workspace = true, optional = true }
tryx-cancel = { workspace = true, optional = true }
tryx-checked = { workspace = true, optional = true }
tryx-parsing = { workspace = true, optional = true }
tryx-stage = { workspace = true, optional = true }

[[example]]
name = "cancel_basic"
required-features = ["cancel"]

[[example]]
name = "cancel_render_loop"
required-features = ["cancel"]

[[example]]
name = "quadratic"
required-features = ["checked"]

[[example]]
name = "kv_parser"
required-features = ["parsing"]

[[example]]
name = "etl_pipeline"
required-features = ["stage"]
